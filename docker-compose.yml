# =================================================================================================
# The local database of Connect: PostgreSQL 16 for every laptop, with pgAdmin to look inside it,
# started with one command.
# =================================================================================================
#
# From the root of the repository, once you copied .env.example to .env:
#
#   docker compose up -d       start the database and pgAdmin; the data stays between starts
#   docker compose ps          see whether both run ("healthy" for the database)
#   docker compose stop        stop both; the data stays
#   docker compose down        remove the containers; the data stays in the volume connect-data
#   docker compose down -v     remove the containers AND the volume: every row is gone
#
# Where to look once it runs:
#
#   http://localhost:5050      pgAdmin in the browser, no login; the server "Connect (local)" is
#                              there. It asks once for the password: POSTGRES_PASSWORD in .env
#   localhost:5432             the database itself, for Rider, DataGrip, DBeaver or psql
#
# For a laptop only. Both ports listen on 127.0.0.1, so nothing outside this computer reaches them.
#
# The database starts empty. The tables come from the EF Core migrations of the server
# (api/Connect.Infrastructure/Persistence/Migrations), never from an SQL file here, so the database
# on every laptop has exactly the tables the code expects. The design with all 44 tables and its
# test data stays in docs/Gurpreet/dataModel/postgres, which is a separate setup for the design only.
#
# The full guide, with the fix for a busy port 5432: docs/team/onboarding.md, section 3.
# Every setting below links to the documentation that says what it does.
# Reference for the whole file format: https://docs.docker.com/reference/compose-file/
# =================================================================================================

# No fixed project name. Compose takes the name of the folder of the checkout, and puts it in
# front of the containers, the network and the volume (connect-nine_connect-data for a checkout in
# a folder named connect-nine). A second checkout gets its own containers and its own database only
# when its folder has another name. Two checkouts in two folders with the same name share one
# project name, so Compose reuses the containers and the volume of the first instead of making a
# second one. Use a different folder name, or docker compose -p <name>, to keep two checkouts apart.
# Source: https://docs.docker.com/compose/how-tos/project-name/

# The containers this file starts. Each entry under services is one container.
# Source: https://docs.docker.com/reference/compose-file/services/
services:

  database:
    # The official PostgreSQL image, pinned to major version 16, the version Connect uses
    # (docs/architecture/techStack.md). Never latest: a new major version would change the database
    # under everyone's feet.
    # Source: https://hub.docker.com/_/postgres
    image: postgres:16

    # No fixed container_name: Compose names the container after the project, for example
    # connect-nine-database-1, so two checkouts in two folders with different names each have their
    # own copy. They run one at a time, because both use the ports below. Commands reach the
    # container by its service name instead: docker compose exec database ...
    # Sources: https://docs.docker.com/reference/compose-file/services/#container_name
    #          https://docs.docker.com/reference/cli/docker/compose/exec/

    # Settings the postgres image reads when it creates the database for the first time. The
    # values come from the file .env in this folder, which Compose reads by itself and which Git
    # ignores. ":?" stops Compose with the message when a value is missing, instead of starting a
    # database without a password.
    # Sources: https://hub.docker.com/_/postgres  (section "Environment Variables")
    #          https://docs.docker.com/compose/how-tos/environment-variables/variable-interpolation/
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env, see .env.example}

    # Port 5432 inside the container is reachable on this computer as port 5432, and only from this
    # computer (127.0.0.1), never from the network (docs/team/codeConventions.md, rule 17).
    # Source: https://docs.docker.com/reference/compose-file/services/#ports
    ports:
      - "127.0.0.1:5432:5432"

    # The data folder of PostgreSQL lives in the named volume connect-data, so a table survives
    # docker compose down and up. /var/lib/postgresql/data is the data folder of the image for
    # PostgreSQL 17 and below.
    # Sources: https://docs.docker.com/reference/compose-file/services/#volumes
    #          https://hub.docker.com/_/postgres  (section "PGDATA")
    volumes:
      - connect-data:/var/lib/postgresql/data

    # Docker asks every 2 seconds whether the database accepts connections, with the PostgreSQL
    # tool pg_isready. Only when it answers yes is the container "healthy". pgAdmin below waits for
    # that, so it never starts against a database that is not ready yet.
    # The user and database come from the environment of the container, the same values as .env,
    # so a check with a user that does not exist never fills the log with FATAL lines. "$$" tells
    # Compose to leave ${...} alone, so the shell inside the container fills it in.
    # Sources: https://docs.docker.com/reference/compose-file/services/#healthcheck
    #          https://docs.docker.com/compose/how-tos/environment-variables/variable-interpolation/
    #          https://www.postgresql.org/docs/16/app-pg-isready.html
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s    # ask every 2 seconds
      timeout: 3s     # one question may take at most 3 seconds
      retries: 30     # after 30 wrong answers in a row the container is "unhealthy"

  pgadmin:
    # The official pgAdmin 4 image, major version 9: a web page to look inside the database.
    # Source: https://hub.docker.com/r/dpage/pgadmin4
    image: dpage/pgadmin4:9

    # Start pgAdmin only once the database is "healthy", see the healthcheck above.
    # Sources: https://docs.docker.com/reference/compose-file/services/#depends_on
    #          https://docs.docker.com/compose/how-tos/startup-order/
    depends_on:
      database:
        condition: service_healthy

    # Settings the pgAdmin image reads at start.
    # Source: https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html
    #         (section "Environment Variables")
    environment:
      # The image refuses to start without these two, even when no login is asked. They are the
      # first pgAdmin user, not the database user. Nobody types them, because pgAdmin has no login
      # page (SERVER_MODE below). Both come from .env, like the values of the database above. The
      # password reuses the database password, so .env holds only one password.
      # Source: https://docs.docker.com/compose/how-tos/environment-variables/variable-interpolation/
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      # Every variable that starts with PGADMIN_CONFIG_ sets the pgAdmin setting with the same
      # name. SERVER_MODE False is desktop mode: one user and no login page.
      # Source: https://www.pgadmin.org/docs/pgadmin4/latest/config_py.html
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # Do not ask for an extra master password to unlock saved passwords. Its default is True.
      # Source: https://www.pgadmin.org/docs/pgadmin4/latest/config_py.html
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

    # pgAdmin listens on port 80 inside the container and opens in the browser at
    # http://localhost:5050, again only from this computer.
    # Source: https://docs.docker.com/reference/compose-file/services/#ports
    ports:
      - "127.0.0.1:5050:80"

    # The list of servers pgAdmin shows on the left. The image reads /pgadmin4/servers.json at its
    # first start, so "Connect (local)" is already there and nobody types the host, port or user.
    # The file is the config pgadmin-servers at the bottom of this file, built from .env.
    # Sources: https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html
    #          (section "Mapped Files and Directories", /pgadmin4/servers.json)
    #          https://docs.docker.com/reference/compose-file/services/#configs
    #
    # Changed POSTGRES_USER or POSTGRES_DB in .env? The docs say "server definitions are only
    # loaded on first launch", and pgAdmin keeps its settings in an anonymous volume that survives
    # a restart. To make it read the list again:
    # docker compose up -d --force-recreate --renew-anon-volumes pgadmin
    # Source: https://docs.docker.com/reference/cli/docker/compose/up/  (-V, --renew-anon-volumes)
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json

# The named volume that holds the data. Docker keeps it until someone runs docker compose down -v.
# Source: https://docs.docker.com/reference/compose-file/volumes/
volumes:
  connect-data:

# The server list of pgAdmin. Compose writes this text into the container as a file and fills in
# ${POSTGRES_USER} and ${POSTGRES_DB} from .env first, so pgAdmin always connects with the same
# user and database as the database service.
# Source: https://docs.docker.com/reference/compose-file/configs/  (attribute content)
#
# The format says every server needs Name, Group, Port, Username, SSLMode, MaintenanceDB and one of
# Host, HostAddr or Service.
# Source: https://www.pgadmin.org/docs/pgadmin4/latest/import_export_servers.html
#
#   "Name": "Connect (local)"   the name shown in the tree on the left
#   "Group": "Connect"          the folder in the tree the server sits in
#   "Host": "database"          where the database is. Inside Docker, Compose lets every container
#                              reach another one by its service name, so pgAdmin finds PostgreSQL
#                              at "database", not at localhost.
#                              Source: https://docs.docker.com/compose/how-tos/networking/
#   "Port": 5432               the port inside the container network
#   "MaintenanceDB"            the database pgAdmin connects to first, POSTGRES_DB in .env
#   "Username"                 the user it logs in as, POSTGRES_USER in .env. The password is not
#                              in the list: pgAdmin asks for it once and can save it.
#   "SSLMode": "disable"        no encryption on the connection. Both containers talk on the private
#                              network Compose made for them, and the postgres image does not
#                              switch SSL on by itself.
#                              https://www.postgresql.org/docs/16/libpq-ssl.html#LIBPQ-SSL-PROTECTION
configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Connect (local)",
            "Group": "Connect",
            "Host": "database",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB}",
            "Username": "${POSTGRES_USER}",
            "SSLMode": "disable"
          }
        }
      }
