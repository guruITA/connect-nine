# The namespace of production and the two logins of the pipeline (issue 93, task 93.2).
# Applied once on the server with: sudo k3s kubectl apply -f infra/k3s/clusterAccess.yaml
# Kubernetes RBAC: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
# Token Secrets: https://kubernetes.io/docs/concepts/configuration/secret/#serviceaccount-token-secrets
# Both read on 25 October 2026.
apiVersion: v1
kind: Namespace
metadata:
  name: connect-production
  labels:
    app.kubernetes.io/part-of: connect
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-planner
  namespace: connect-production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-deployer
  namespace: connect-production
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-planner-token
  namespace: connect-production
  annotations:
    kubernetes.io/service-account.name: gitlab-planner
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-deployer-token
  namespace: connect-production
  annotations:
    kubernetes.io/service-account.name: gitlab-deployer
type: kubernetes.io/service-account-token
---
# The planner makes the plan on every merge request, also on branches that are not reviewed yet,
# so it may only read, and never a Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: connect-planner
  namespace: connect-production
rules:
  - apiGroups: [""]
    resources: [configmaps, services, persistentvolumeclaims, pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
---
# The deployer applies what was reviewed, only in the pipelines of dev and main, so it may change
# the same kinds and write the Secrets of applySecrets.sh, but nothing outside connect-production.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: connect-deployer
  namespace: connect-production
rules:
  - apiGroups: [""]
    resources: [configmaps, services, persistentvolumeclaims, pods, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-planner
  namespace: connect-production
subjects:
  - kind: ServiceAccount
    name: gitlab-planner
    namespace: connect-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: connect-planner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-deployer
  namespace: connect-production
subjects:
  - kind: ServiceAccount
    name: gitlab-deployer
    namespace: connect-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: connect-deployer
---
# kube-check reads whether the node is Ready. Nodes do not live in a namespace, so this one rule is
# a ClusterRole, with only get and list.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: connect-node-reader
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: connect-node-reader
subjects:
  - kind: ServiceAccount
    name: gitlab-planner
    namespace: connect-production
  - kind: ServiceAccount
    name: gitlab-deployer
    namespace: connect-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: connect-node-reader
